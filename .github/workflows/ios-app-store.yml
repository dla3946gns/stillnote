name: AJ Notes App Store

on:
  pull_request:
    paths:
      - '.github/workflows/ios-app-store.yml'
      - '.github/workflows/ios-testflight.yml'
      - 'mobile/app-store/**'
      - 'mobile/scripts/app_store*.py'
      - 'mobile/scripts/test_app_store*.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Action for the selected iOS version
        type: choice
        options: [status, metadata, append-screenshots, replace-screenshots, submit-review]
        default: status
        required: true
      version:
        description: Existing App Store version (such as 1.0)
        type: string
        required: true
      locale:
        description: App Store localization
        type: string
        default: ko
      group:
        description: Screenshot device group from listing.json
        type: string
      build_number:
        description: Exact processed or processing TestFlight build number for submit-review
        type: string
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build_number:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate App Store automation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 mobile/scripts/app_store.py check-files
      - run: python3 -m unittest discover -s mobile/scripts -p 'test_app_store*.py' -v

  store:
    name: App Store Connect
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    concurrency:
      group: aj-notes-app-store
      cancel-in-progress: false
    environment: ios-testflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install verified App Store Connect CLI
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --output asc \
            https://github.com/rorkai/App-Store-Connect-CLI/releases/download/7.4.0/asc_7.4.0_linux_amd64
          echo '509b586ff23a97370d271389656f99ea65019c0d84697916b58eef3db4073ca3  asc' | sha256sum --check
          chmod 700 asc
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run selected operation
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_BYPASS_KEYCHAIN: '1'
          ASC_READ_ONLY: ${{ inputs.mode == 'status' && '1' || '' }}
          STORE_MODE: ${{ inputs.mode || 'submit-review' }}
          STORE_VERSION: ${{ inputs.version }}
          STORE_LOCALE: ${{ inputs.locale || 'ko' }}
          STORE_GROUP: ${{ inputs.group }}
          STORE_BUILD: ${{ inputs.build_number }}
        run: |
          python3 mobile/scripts/app_store.py "$STORE_MODE" --version "$STORE_VERSION" \
            --locale "$STORE_LOCALE" --group "$STORE_GROUP" --build-number "$STORE_BUILD"
