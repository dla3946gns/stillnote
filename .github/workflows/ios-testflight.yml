name: AJ Notes TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to App Store Connect
        type: boolean
        default: false
      internal_only:
        description: Restrict uploaded build to TestFlight internal testing
        type: boolean
        default: true
      submit_review:
        description: Upload an App Store eligible build and submit this exact build to App Review
        type: boolean
        default: false
      marketing_version:
        description: Optional iOS version override (defaults to the Xcode project version)
        type: string

      export_compliance:
        description: Confirm no non-exempt encryption only after checking app and third-party dependencies
        type: choice
        options: [preserve, confirm-no-non-exempt]
        default: preserve

permissions:
  contents: read

concurrency:
  group: aj-notes-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    environment: ios-testflight
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      version: ${{ steps.archive.outputs.version }}
      build_number: ${{ steps.archive.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Archive AJ Notes for iPhone
        id: archive
        shell: bash
        env:
          STORE_VERSION: ${{ inputs.marketing_version }}
        run: |
          xcodebuild -version
          chmod +x mobile/gradlew
          settings=()
          if [[ -n "$STORE_VERSION" ]]; then
            [[ "$STORE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]
            settings+=("MARKETING_VERSION=$STORE_VERSION")
          fi
          xcodebuild archive \
            -project mobile/iosApp/Stillnote.xcodeproj \
            -scheme Stillnote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AJNotes.xcarchive" \
            DEVELOPMENT_TEAM=R8P3TN6FZS \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" "${settings[@]}"
          info="$RUNNER_TEMP/AJNotes.xcarchive/Products/Applications/Stillnote.app/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$info")" == com.stillnotes.app ]]
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$info")
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$info")
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ && "$version" == "${STORE_VERSION:-$version}" ]]
          [[ "$build" == "$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIcons:CFBundlePrimaryIcon' "$info"
      - name: Cloud-sign and upload to App Store Connect
        if: inputs.upload || inputs.submit_review
        shell: bash
        env:
          TESTFLIGHT_INTERNAL_ONLY: ${{ !inputs.submit_review && inputs.internal_only }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}"
          : "${ASC_PRIVATE_KEY:?Missing ASC_PRIVATE_KEY}"
          umask 077
          key_dir="$(mktemp -d "$RUNNER_TEMP/asc-key.XXXXXX")"
          trap 'rm -f "$key_dir"/AuthKey_*.p8; rmdir "$key_dir"' EXIT
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          unset ASC_PRIVATE_KEY

          options="$RUNNER_TEMP/TestFlightExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>R8P3TN6FZS</string>
            <key>testFlightInternalTestingOnly</key>
            <$TESTFLIGHT_INTERNAL_ONLY/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AJNotes.xcarchive" \
            -exportPath "$RUNNER_TEMP/AJNotes-export" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

  app-review:
    name: App Store Connect review submission
    needs: testflight
    if: inputs.submit_review && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    concurrency:
      group: aj-notes-app-store
      cancel-in-progress: false
    environment: ios-testflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate App Store automation
        run: |
          python3 mobile/scripts/app_store.py check-files
          python3 -m unittest discover -s mobile/scripts -p 'test_app_store*.py' -v
      - name: Install verified App Store Connect CLI
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --output asc \
            https://github.com/rorkai/App-Store-Connect-CLI/releases/download/7.4.0/asc_7.4.0_linux_amd64
          echo '509b586ff23a97370d271389656f99ea65019c0d84697916b58eef3db4073ca3  asc' | sha256sum --check
          chmod 700 asc
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run selected operation
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          STORE_MODE: submit-review
          STORE_VERSION: ${{ needs.testflight.outputs.version }}
          STORE_LOCALE: ko
          STORE_GROUP: ''
          STORE_BUILD: ${{ needs.testflight.outputs.build_number }}
          STORE_EXPORT_COMPLIANCE: ${{ inputs.export_compliance }}
        shell: bash
        run: bash mobile/scripts/app_store_ci.sh
