name: Entitlements API unit tests

on:
  pull_request:
    paths:
      - 'services/entitlements/**'
      - '.github/workflows/entitlements-api.yml'
  push:
    branches: [main]
    paths:
      - 'services/entitlements/**'
      - '.github/workflows/entitlements-api.yml'

permissions:
  contents: read

jobs:
  test:
    name: Verify free entitlements API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/entitlements
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript compiler
        run: npm ci
      - name: Typecheck, compile and run API security tests
        run: npm test
