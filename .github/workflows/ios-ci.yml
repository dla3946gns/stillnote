name: AJ Notes Store screenshots
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stillnote-ios-simulator-qa
          run-id: 43731577106
          github-token: ${{ github.token }}
          path: simulator
      - name: Capture app on iPhone and iPad
        shell: bash
        run: |
          mkdir screenshots extracted
          ditto -x -k simulator/Stillnote-iOS-Simulator.zip extracted
          for family in iPhone iPad; do
            if [[ "$family" == iPhone ]]; then
              model='iPhone 18 Pro Max'
            else
              model='iPad Pro 13-inch (M5)'
            fi
            device="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"]==sys.argv[1]))' "$model")"
            xcrun simctl boot "$device"
            xcrun simctl bootstatus "$device" -b
            xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState unplugged --batteryLevel 100
            xcrun simctl ui "$device" appearance light
            xcrun simctl install "$device" extracted/Stillnote.app
            container="$(xcrun simctl get_app_container "$device" com.stillnotes.app data)"
            notes="$container/Library/Application Support/Stillnote"
            mkdir -p "$notes"
            cat > "$notes/stillnote-notes.json" <<'JSON'
          [{"id":"sample-1","title":"주말 여행 준비","body":"숙소 예약 확인 · 보조 배터리 챙기기","createdAt":1794787200000,"updatedAt":1794787200000,"pinned":true},{"id":"sample-2","title":"읽고 싶은 책","body":"도서관에 들러 읽을 책을 찾아보기","createdAt":1794700800000,"updatedAt":1794700800000,"pinned":false},{"id":"sample-3","title":"장보기 목록","body":"사과 · 달걀 · 우유 · 원두","createdAt":1794614400000,"updatedAt":1794614400000,"pinned":false}]
          JSON
            xcrun simctl launch "$device" com.stillnotes.app
            sleep 4
            xcrun simctl io "$device" screenshot "screenshots/AJ-Notes-$family.png"
            xcrun simctl shutdown "$device"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aj-notes-store-screenshots
          path: screenshots/
