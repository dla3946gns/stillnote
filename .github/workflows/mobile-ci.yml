name: Mobile PR validation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'docs/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and shared checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo 'Android SDK command-line tools missing'; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Verify offline and public privacy policy match
        run: python3 scripts/verify-privacy-policy.py
      - name: Shared notes host tests and Android build
        run: bash ./gradlew :shared:testAndroidHostTest :androidApp:testDebugUnitTest :androidApp:assembleDebug --stacktrace
      - name: Upload notes test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-host-test-results
          path: |
            mobile/shared/build/test-results/testAndroidHostTest/
            mobile/androidApp/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload debug APK for physical-device QA
        uses: actions/upload-artifact@v4
        with:
          name: stillnote-android-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test signed release AAB using a disposable CI-only key
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(mktemp -d "$RUNNER_TEMP/stillnote-release-smoke.XXXXXX")"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$TEMP_DIR/ci-only.p12" -alias ci-smoke \
            -storepass ci-only-not-for-release -keypass ci-only-not-for-release \
            -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=Disposable Stillnote CI Smoke Key" >/dev/null 2>&1
          export STILLNOTE_UPLOAD_KEYSTORE="$TEMP_DIR/ci-only.p12"
          export STILLNOTE_UPLOAD_STORE_PASSWORD="ci-only-not-for-release"
          export STILLNOTE_UPLOAD_KEY_ALIAS="ci-smoke"
          export STILLNOTE_UPLOAD_KEY_PASSWORD="ci-only-not-for-release"
          bash ./gradlew :androidApp:bundleRelease --stacktrace
          BUNDLE="androidApp/build/outputs/bundle/release/androidApp-release.aab"
          test -s "$BUNDLE"
          jarsigner -verify "$BUNDLE" > "$TEMP_DIR/verification.txt"
          grep -q "jar verified" "$TEMP_DIR/verification.txt"
          # Never upload this bundle: its key is discarded after this step.
          rm -f "$BUNDLE"

  android-upgrade:
    name: Android in-place upgrade preserves saved notes
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Checkout exactly the old base commit and the candidate commit.
      # Build both on the SAME runner so they use the SAME debug signing key.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compilation SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build existing-main APK and its UI test APK
        working-directory: baseline/mobile
        run: bash ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest --stacktrace
      - name: Build candidate APK with higher versionCode
        working-directory: candidate/mobile
        # Override only inside this verification, never bump the production code.
        run: bash ./gradlew :androidApp:assembleDebug -PstillnoteVersionCode=2 --stacktrace
      - name: Enable hardware-accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install baseline, save a real memo, update in place and verify bytes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash candidate/mobile/scripts/run-upgrade-preservation-test.sh baseline/mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk baseline/mobile/androidApp/build/outputs/apk/androidTest/debug/androidApp-debug-androidTest.apk candidate/mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk

  emulator-ui:
    name: Android emulator UI (light and dark)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android compilation SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run Compose UI journeys on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash mobile/scripts/run-emulator-ui-tests.sh
      - name: Upload emulator test reports and theme captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-qa
          path: |
            mobile/androidApp/build/outputs/androidTest-results/connected/
            mobile/androidApp/build/reports/androidTests/connected/
            mobile/androidApp/build/qa-screenshots/
          if-no-files-found: warn
