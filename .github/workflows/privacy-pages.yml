name: Publish Stillnote privacy policy

# Only our static public docs are deployed. A Pages site must first be enabled
# as "GitHub Actions" in the repository's Settings -> Pages by the owner.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mobile/androidApp/src/main/assets/privacy-policy-ko.txt'
      - 'mobile/scripts/verify-privacy-policy.py'
      - '.github/workflows/privacy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stillnote-privacy-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch public policy sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check offline and public privacy notices are identical
        run: python3 mobile/scripts/verify-privacy-policy.py

      # The standard GITHUB_TOKEN cannot create a new Pages site.
      # If not yet enabled, explain the one-time owner action and skip deployment.
      - name: Check GitHub Pages activation
        id: pages_status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl -sS -o "$RUNNER_TEMP/stillnote-pages.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [[ "$response" == "404" ]]; then
            echo "::notice::GitHub Pages is not enabled. The repo owner must choose 'GitHub Actions' in Settings -> Pages -> Source, then rerun this workflow."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ "$response" == "200" ]]; then
            build_type="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("build_type", ""))' "$RUNNER_TEMP/stillnote-pages.json")"
            if [[ "$build_type" == "workflow" ]]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Pages is configured for '$build_type'; select 'GitHub Actions' as the publishing Source in Settings -> Pages, then rerun."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::Could not check GitHub Pages status (HTTP $response)."
            exit 1
          fi

      - name: Configure Pages
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload only the public docs folder
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy public privacy page
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
        id: deployment
