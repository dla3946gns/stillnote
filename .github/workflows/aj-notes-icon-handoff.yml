name: Generate approved AJ Notes icons

# Temporary, isolated handoff. Never runs on main or uses store credentials.
on:
  push:
    branches: [aj-notes-icon-update]
    paths:
      - 'mobile/play/assets/aj-notes-mascot.png'

permissions:
  contents: read

concurrency:
  group: aj-notes-icon-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install existing image tool dependencies
        run: python3 -m pip install 'Pillow==11.3.0' 'cairosvg==2.8.2'
      - name: Generate and validate approved icons
        run: |
          set -euo pipefail
          python3 mobile/scripts/generate-aj-notes-icons.py
          python3 mobile/scripts/google_play_listing.py validate
          python3 -m unittest discover -s mobile/scripts -p test_google_play_listing.py -v
          python3 mobile/scripts/build-play-assets.py --output "$RUNNER_TEMP/play-icon-check"
          git diff --check
      - name: Commit only approved icon changes to this branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/aj-notes-icon-update
          git add mobile/androidApp/src/main/AndroidManifest.xml \
            mobile/androidApp/src/main/res/mipmap-*/ic_aj_notes* \
            mobile/androidApp/src/main/res/values/aj_notes_icon.xml \
            mobile/iosApp/Stillnote/Assets.xcassets/AppIcon.appiconset/AppIcon.png \
            mobile/play/assets/aj-notes-play-icon-512.png \
            mobile/play/listing-ko.json mobile/scripts/build-play-assets.py
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply approved AJ Notes Android and iOS icons"
            git push origin HEAD:refs/heads/aj-notes-icon-update
          fi
      - name: Run existing CI on the generated commit (no store submission)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mobile-ci.yml --ref aj-notes-icon-update
          gh workflow run ios-ci.yml --ref aj-notes-icon-update
          gh workflow run google-play-listing.yml --ref aj-notes-icon-update -f mode=validate -f language=ko-KR
